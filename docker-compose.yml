networks:
  network:
    driver: bridge
    name: konnektado-hub

services:
  db:
    container_name: konnektado-db
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: always
    ports:
      - 127.0.0.1:${MYSQL_LOCAL_PORT}:3306
    networks:
      - network
    volumes:
      - ./db/etc/mysql/my.cnf:/etc/mysql/my.cnf
      - db-storage:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-"r00t"}
      - MYSQL_USER=${MYSQL_USERNAME:-app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-4pp}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-app}
      - TZ=Europe/Berlin
  app:
    build:
      context: ./application
      dockerfile: Dockerfile
      args:
        - COMPOSE_BAKE=true
    restart: always
    container_name: konnektado-app
    depends_on:
      - db
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/up" ]
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 5s
    environment:
      - TZ=Europe/Berlin
      - DB_HOST=${DB_HOST}
      - DB_USERNAME=${MYSQL_USERNAME}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_DATABASE=${MYSQL_DATABASE}
      - DB_PORT=3306
      - APACHE_RUN_USER=${APACHE_RUN_USER}
      - APACHE_RUN_GROUP=${APACHE_RUN_GROUP}
      - USER_ID=${RUN_UID}
      - GROUP_ID=${RUN_GID}
      - APACHE_LOG_DIR=/var/log/apache2
    volumes:
      - ./application/app:/app
      - ./docker/etc/passwd:/etc/passwd:ro
      - ./docker/etc/group:/etc/group:ro
      - ./docker/etc/nginx/snakeoil/ssl-cert-snakeoil.pem:/etc/nginx/snakeoil/ssl-cert-snakeoil.pem
      - ./docker/etc/nginx/snakeoil/ssl-cert-snakeoil.key:/etc/nginx/snakeoil/ssl-cert-snakeoil.key
    command:
      [
        "sh", "-c",
        "rm -rf /var/log/apache2/* && apache2-foreground -c 'ServerName localhost'"
      ]
    networks:
      - network
  proxy:
    container_name: konnektado-proxy
    build:
      context: ./proxy
      dockerfile: Dockerfile
    restart: always
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./proxy/etc/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./proxy/etc/nginx/snippets/snakeoil.conf:/etc/nginx/snippets/ssl.conf
      - ./proxy/etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./proxy/etc/nginx/snippets/server_ssl_app.conf:/etc/nginx/snippets/server_ssl_app.conf
      - ./proxy/etc/nginx/snippets/server_websocket.conf:/etc/nginx/snippets/server_websocket.conf
      - ./proxy/certbot/conf:/etc/letsencrypt
      - ./proxy/certbot/www:/var/www/certbot
    ports:
      - ${BIND_HOST}:${BIND_PORT}:81
      - ${BIND_HOST}:${BIND_SPORT}:444
      - ${BIND_HOST}:${BIND_WPORT}:29000
    networks:
      - network
    command:
      [
        "sh", "-c",
        "mkdir -p /var/run/nginx && \
         rm -f /var/run/nginx/nginx.pid && \
         rm -rf /var/log/nginx/* && \
         while :; do sleep 6h & wait $${!}; nginx -s reload; done & \
         nginx -g 'daemon off;'"
      ]

volumes:
  db-storage:
    name: ia-app-konnektado-db-storage